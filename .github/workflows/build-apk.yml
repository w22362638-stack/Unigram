name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Build APK
          echo "=== APP_PACKAGE CHECK ==="
          grep "^APP_PACKAGE=" gradle.properties
          ./gradlew -q properties | grep "^appPackage:" || true
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=1 :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Find APK
        run: |
          mkdir -p release
          find . -type f -name "*.apk" -print
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" release/Unigram.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-APK
          path: release/Unigram.apk
          if-no-files-found: error
