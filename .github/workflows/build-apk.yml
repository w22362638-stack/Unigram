name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f | grep sdkmanager || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x ./gradlew

          # Realme 8 / Helio G95: ARM64 فقط
          ./gradlew assembleRelease \
            -PABI_FILTERS=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            --build-cache \
            --no-daemon

      - name: Prepare single APK
        shell: bash
        run: |
          set -e
          mkdir -p release
          APK=$(find . -type f -name "*.apk" -not -path "./release/*" | head -n 1)
          test -n "$APK"
          cp "$APK" release/Telegram.apk
          echo "APK: $APK"
          ls -lh release/Telegram.apk

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APK
          path: release/Telegram.apk
          if-no-files-found: error
          retention-days: 7
