name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f | grep sdkmanager || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x ./gradlew

          # Realme 8 / Helio G95: ARM64 فقط
          ./gradlew TMessagesProj_App:packageBundleAfatReleaseUniversalApk \
            -PABI_FILTERS=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            --build-cache \
            --no-daemon

      - name: Prepare and sign installable APK
        shell: bash
        run: |
          set -e
          rm -rf release
          mkdir -p release

          APK="TMessagesProj_App/build/outputs/apk_from_bundle/bundleAfatRelease/TMessagesProj_App-bundleAfat-release-universal.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found: $APK"
            find TMessagesProj_App -type f -name "*.apk" -print
            exit 1
          fi

          SDK="$ANDROID_HOME"
          BUILD_TOOLS=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          echo "Using build-tools: $BUILD_TOOLS"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          "$BUILD_TOOLS/zipalign" -f 4 "$APK" release/Unigram-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out release/Unigram.apk \
            release/Unigram-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose release/Unigram.apk

          rm -f release/Unigram-aligned.apk

          echo "=== Final APK ==="
          ls -lh release/Unigram.apk

          SIZE=$(stat -c%s release/Unigram.apk)
          test "$SIZE" -gt 1000000

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-APK
          path: release/Unigram.apk
          if-no-files-found: error
          retention-days: 7
