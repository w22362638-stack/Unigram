name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f | grep sdkmanager || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        run: |
          chmod +x ./gradlew

          # Realme 8 / Helio G95: ARM64 فقط
          ./gradlew TMessagesProj_App:packageBundleAfatReleaseUniversalApk \
            -PABI_FILTERS=arm64-v8a \
            -Pandroid.injected.build.abi=arm64-v8a \
            --build-cache \
            --no-daemon

      - name: Build direct installable APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --build-cache

      - name: Prepare installable APK
        shell: bash
        run: |
          set -e
          rm -rf release
          mkdir -p release

          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"

          echo "=== APKs generated ==="
          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f "$APK" ]; then
            echo "Direct APK not found: $APK"
            exit 1
          fi

          cp "$APK" release/Unigram.apk

          echo "=== Final APK ==="
          ls -lh release/Unigram.apk

          SIZE=$(stat -c%s release/Unigram.apk)
          test "$SIZE" -gt 1000000

          echo "APK is ready."
          
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-APK
          path: release/Unigram.apk
          if-no-files-found: error
          retention-days: 7
