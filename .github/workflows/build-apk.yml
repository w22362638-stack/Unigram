name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Accept Android SDK licenses
        run: |

      - name: Clean Gradle state
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists
          rm -rf .gradle
          find . -type d -name build -prune -exec rm -rf {} +

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew --no-daemon --max-workers=1

          ./gradlew --no-daemon --max-workers=1 :TMessagesProj_App:assembleAfatRelease             -PABI_FILTERS=arm64-v8a             -Pandroid.injected.build.abi=arm64-v8a             --no-daemon             --no-build-cache             --refresh-dependencies             --stacktrace             --warning-mode all             2>&1 | tee gradle-build.log

      - name: Show Gradle diagnostics
        if: failure()
        run: |
          echo "========== LAST 250 LINES =========="
          tail -n 250 gradle-build.log || true
          echo "========== ERRORS =========="
          grep -n -E "FAILURE:|What went wrong:|Caused by:|Execution failed|error:" gradle-build.log | tail -n 100 || true

      - name: Prepare APK
        if: success()
        run: |
          set -e
          mkdir -p release

          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          cp "$APK" release/Unigram.apk
          ls -lh release/Unigram.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-APK
          path: release/Unigram.apk
          if-no-files-found: error
          retention-days: 7
