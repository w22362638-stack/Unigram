name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f | grep sdkmanager || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build complete APKs
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew

          ./gradlew --version

          ./gradlew --parallel \
            :TMessagesProj_App:bundleBundleAfat_SDK23Release \
            :TMessagesProj_App:bundleBundleAfatRelease \
            :TMessagesProj_App:assembleAfatRelease \
            --stacktrace --info --console=plain \
            --no-daemon

      - name: Show Gradle failure
        if: failure()
        run: |
          echo "===== GRADLE FAILURE ====="
          grep -n -B 15 -A 40 -E "What went wrong|Execution failed for task|Caused by:|CMake Error|error:" build.log 2>/dev/null || true
          echo "===== END FAILURE ====="

      - name: Verify Unigram package identity
        shell: bash
        run: |
          set -e
          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)

          echo "=== PACKAGE ID / APP NAME ==="
          "$AAPT" dump badging "$APK" | grep -E "package:|application-label:" | head -5

          "$AAPT" dump badging "$APK" | grep -q "name='org.unigram.messenger'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'Unigram'"

      - name: Verify complete installable APK
        shell: bash
        run: |
          set -e

          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"

          echo "=== ALL APK OUTPUTS ==="
          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \;

          echo "=== ALL BUNDLE OUTPUTS ==="
          find TMessagesProj_App/build/outputs/bundle -type f -print | head -100 || true

          if [ ! -f "$APK" ]; then
            echo "ERROR: complete APK does not exist:"
            echo "$APK"
            exit 1
          fi

          echo "=== APK ZIP TEST ==="
          unzip -t "$APK" >/dev/null

          echo "=== APK SIGNATURE ==="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

          echo "=== APK PACKAGE ==="
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -20

          echo "=== NATIVE LIBRARIES ==="
          unzip -l "$APK" | grep 'lib/.*/.*\.so' | head -100

          echo "=== REQUIRED ABIs ==="
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            if unzip -l "$APK" | grep -q "lib/$ABI/"; then
              echo "OK: $ABI"
            else
              echo "MISSING: $ABI"
              exit 1
            fi
          done

          echo "=== FINAL APK ==="
          mkdir -p release
          cp "$APK" release/Unigram.apk
          sha256sum release/Unigram.apk
          ls -lh release/Unigram.apk

          SIZE=$(stat -c%s release/Unigram.apk)
          test "$SIZE" -gt 1000000

          echo "COMPLETE INSTALLABLE APK VERIFIED."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-APK
          path: release/Unigram.apk
          if-no-files-found: error
          retention-days: 7
