name: Build APK
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          echo "=== WHAT WENT WRONG ==="
          grep -n -A15 "What went wrong" build.log | head -60
          echo "=== ERRORS ==="
          grep -n "error:\|FAILED\|Could not\|No such file\|not found" build.log | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
